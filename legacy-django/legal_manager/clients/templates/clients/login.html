{% extends 'clients/base.html' %}
{% block title %}تسجيل الدخول{% endblock %}
{% block auth_content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="text-center mb-4">
            <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                 style="width:70px;height:70px;font-size:2rem;">
                <i class="fas fa-balance-scale"></i>
            </div>
            <h4 class="fw-bold" style="color:#1a3c5e;">نظام إدارة مكتب المحاماة</h4>
            <p class="text-muted">يرجى تسجيل الدخول للمتابعة</p>
        </div>
        <div class="content-card card">
            <div class="card-body p-4">
                {% if form.errors %}
                    <div class="alert alert-danger">اسم المستخدم أو كلمة المرور غير صحيحة</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">اسم المستخدم</label>
                        <input type="text" name="username" class="form-control form-control-lg" autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">كلمة المرور</label>
                        <input type="password" name="password" class="form-control form-control-lg">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="fas fa-sign-in-alt me-2"></i>تسجيل الدخول
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
