{% extends 'clients/base.html' %}
{% block title %}تأكيد الحذف{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="content-card card border-danger">
            <div class="card-header bg-danger text-white fw-bold">
                <i class="fas fa-exclamation-triangle me-2"></i>تأكيد الحذف
            </div>
            <div class="card-body text-center py-5">
                <i class="fas fa-trash fa-3x text-danger mb-3"></i>
                <h5>هل أنت متأكد من حذف {{ type }}؟</h5>
                <p class="text-muted">{{ object }}</p>
                <p class="text-danger small">لا يمكن التراجع عن هذه العملية</p>
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger btn-lg">
                            <i class="fas fa-trash me-2"></i>نعم، احذف
                        </button>
                    </form>
                    <a href="javascript:history.back()" class="btn btn-secondary btn-lg">
                        <i class="fas fa-times me-2"></i>إلغاء
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
